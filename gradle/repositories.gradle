// Extra Maven repositories for the dependencies of the mods.
// The mod projects and the dev project apply this file, because the dev project resolves
// the dependencies of all mods.
repositories {
    // Mods from Modrinth, for example Xaero's maps (optional integration).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    // Cartofold (maps, required by the world mod): the jar of its GitHub Release, with no token. The group is the
    // group of Cartofold in GitHub Packages. The repository has no metadata: the jar is the artifact.
    exclusiveContent {
        forRepository {
            ivy {
                name = 'Cartofold releases'
                url = 'https://github.com/nicolas-goyon/Cartofold/releases/download'
                patternLayout {
                    artifact 'v[revision]/[module]-[revision].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeGroup 'io.github.nicolasgoyon.cartofold'
        }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
}
