// Shared configuration for each mod subproject (core, world, balance, events).
// The subproject must apply the plugins 'java-library', 'maven-publish' and 'net.neoforged.moddev' first,
// and must set mod_id, mod_name and mod_description in its gradle.properties.

apply from: rootProject.file('gradle/repositories.gradle')
apply plugin: 'com.diffplug.spotless'
apply plugin: 'net.ltgt.errorprone'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources {
    // Resources from the data generators.
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude '.cache'
}

// GameTests: in-game tests in src/gametest. The dev project loads this source set with the mod in its runs
// (see dev/build.gradle). The jar and the sources jar of the mod do not contain it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    // Dependencies for local runs only. They are not published.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    errorprone "com.google.errorprone:error_prone_core:${errorprone_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The assertions of JUnit, for the helpers of the GameTests.
    gametestImplementation platform("org.junit:junit-bom:${junit_version}")
    gametestImplementation 'org.junit.jupiter:junit-jupiter-api'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn ':checkTranslations', ':spotlessCheck'
    // The build compiles the GameTests, so a compile error shows before the GameTest server runs.
    dependsOn 'compileGametestJava'
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    addModdingDependenciesTo(sourceSets.gametest)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        // Data generation for this mod only. Output: src/generated/resources.
        // Client, server and GameTest runs are in the 'dev' project, with all mods loaded.
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
}

// Expands the properties in src/main/templates (for example META-INF/neoforge.mods.toml).
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            geckolib_version       : geckolib_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // All the javac lints are errors. The 'this-escape' lint is off: the Minecraft entities, widgets and block
    // entities set their state in the constructor through the methods of the super class.
    options.compilerArgs.addAll(['-Xlint:all,-this-escape', '-Werror'])
    options.errorprone {
        disableWarningsInGeneratedCode = true
        // The registry objects of Minecraft (items, entity types, professions) and the entities are compared
        // by identity: this is the convention of the game code.
        disable('ReferenceEquality')
    }
}

// Format checks. The style is the style of the sources: four spaces, imports in one group in ASCII order, static
// imports first. `spotlessApply` fixes the files.
spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder('\\#', '')
        removeUnusedImports()
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
    format('misc') {
        target 'src/*/resources/**/*.json', 'src/*/resources/**/*.toml'
        // The data generators write their own format.
        targetExclude 'src/generated/**'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        // GitHub Packages. The release workflow sets GITHUB_ACTOR and GITHUB_TOKEN.
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/nicolas-goyon/folkhold')
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').getOrElse('')
                password = providers.environmentVariable('GITHUB_TOKEN').getOrElse('')
            }
        }
    }
}
