# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft and NeoForge
# Find NeoForge versions at https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
loader_version_range=[1,)

# Parchment (parameter names and Javadoc). See https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Shared mod properties. Each subproject sets mod_id, mod_name and mod_description in its own gradle.properties.
# The release workflow replaces mod_version with the version of the release (see scripts/version.py).
mod_version=0.1.0-SNAPSHOT
mod_group_id=io.github.nicolasgoyon.folkhold
mod_license=MIT
mod_authors=nicolas-goyon

# GeckoLib (animations of the faction units). See https://modrinth.com/mod/geckolib
geckolib_version=4.9.3

# Test libraries
junit_version=5.14.1

# Static analysis. See https://errorprone.info
errorprone_version=2.50.0
