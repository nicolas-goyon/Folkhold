version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # NeoForge must stay on 21.1.x (Minecraft 1.21.1). Update it by hand in gradle.properties.
      - dependency-name: net.neoforged:neoforge

  - package-ecosystem: docker
    directory: /.devcontainer
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    ignore:
      # Minecraft 1.21.1 targets Java 21. Keep the JDK image on major version 21.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
