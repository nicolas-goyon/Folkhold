name: Set up JDK 21 and Gradle
description: Installs JDK 21 (Temurin) and sets up Gradle with its cache.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
