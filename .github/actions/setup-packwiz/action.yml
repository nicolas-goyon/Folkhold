name: Set up packwiz
description: Installs Go and packwiz, for scripts/export-modpack.sh.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'
        cache: false

    # packwiz has no releases: the commit is the same as in .devcontainer/Dockerfile, so all the builds and the
    # releases have the same .mrpack content. The download can fail on a network error, so the step tries 3 times.
    - name: Install packwiz
      shell: bash
      run: |
        for attempt in 1 2 3; do
          go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e && exit 0
          echo "Attempt $attempt failed. Next attempt in 15 seconds."
          sleep 15
        done
        exit 1
