name: Feature
description: A new feature or a change to a feature.
labels: ["type: feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must the feature do? Why?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      placeholder: |
        - [ ] ...
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know that the work is done? (tests, behavior in the game)
  - type: input
    id: design
    attributes:
      label: Design reference
      description: Section of docs/design.md, if any.
