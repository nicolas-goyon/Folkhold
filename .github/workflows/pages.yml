name: Pages

# Publishes the site of the project to GitHub Pages. scripts/pages.py builds the site from site/ and from the releases
# of the GitHub API: the downloads of the latest release and the notes of all the releases, in each language of
# site/lang/. The site also has version.json, with the version of the latest release in the format of the endpoint
# badges of shields.io. The version badge of the README reads this file, so the badge does not need the GitHub API.
# The workflow deploys from develop, because the environment github-pages accepts only the deployments from the default
# branch. It runs when the site changes, and after each release: the workflow Release starts it. On a pull request
# that changes the site, the workflow builds the site and does not deploy it. The artifact github-pages of the run
# contains the site.

on:
  push:
    branches: [develop]
    paths:
      - 'site/**'
      - 'scripts/pages.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, for gradle.properties at the tag of the latest release.
          fetch-depth: 0

      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pages.py --repo "$GITHUB_REPOSITORY" --out build/site --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deployment at a time: a new deployment waits for the deployment in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
