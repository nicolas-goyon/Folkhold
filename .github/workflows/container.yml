name: Dev container

on:
  push:
    branches: [main, develop]
    paths:
      - '.devcontainer/**'
      - 'compose.yaml'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'compose.yaml'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build the dev image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the image
        run: docker compose build dev

      - name: Check the tools in the image
        run: docker compose run --rm -T dev sh -c 'java -version && git --version && python3 --version && packwiz --help > /dev/null && echo "packwiz OK"'
