name: Release

# A merge of develop into main makes a release. The version comes from the bump markers of the commits (see
# scripts/version.py). The workflow calls the workflow Build (workflow_call): it builds the mods and the modpack once,
# and runs the tests. When all the jobs of the build pass, the workflow tags the commit of develop, creates a GitHub
# Release with the jars and the modpack (.mrpack) of the build, then publishes the Maven files of the build to GitHub
# Packages. The release comes first: a Maven version is immutable, so a failed release step can run again only when
# the publication did not happen.
# When the tag of the version exists, the workflow does not build and makes no release. To run it again after a failure, use
# "Run workflow" on main.
# After the release, the workflow starts the workflow Pages on develop. Pages publishes the site of the project with
# the downloads and the notes of the releases, and version.json for the version badge of the README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # When the tag of the version exists, the next jobs do not run: no build and no release.
  tag:
    name: Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the version.
          fetch-depth: 0

      - name: Calculate the version
        id: version
        uses: ./.github/actions/version
        with:
          release: 'true'

  build:
    name: Build
    needs: tag
    if: needs.tag.outputs.exists == 'false'
    uses: ./.github/workflows/build.yml
    with:
      release: true

  release:
    name: Publish
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      COMMIT: ${{ needs.build.outputs.commit }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the release notes.
          fetch-depth: 0

      - name: Write the release notes
        uses: ./.github/actions/version
        with:
          release: 'true'
          rev: ${{ env.COMMIT }}
          notes: ${{ runner.temp }}/release-notes.md

      - name: Download the mod jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: folkhold-mods

      - name: Download the modpack
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: folkhold-modpack
          path: build

      - name: Download the Maven files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: folkhold-maven
          path: build/maven

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ runner.temp }}/release-notes.md
        shell: bash
        run: |
          shopt -s nullglob
          files=( */build/libs/folkhold_*-"${VERSION}".jar build/*.mrpack )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No jar to release for the version ${VERSION}." >&2
            exit 1
          fi
          gh release create "$TAG" "${files[@]}" \
            --target "$COMMIT" \
            --title "Folkhold ${VERSION}" \
            --notes-file "$NOTES"

      - name: Publish to GitHub Packages
        env:
          MAVEN_USER: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/maven_publish.py build/maven "https://maven.pkg.github.com/${GITHUB_REPOSITORY,,}"

  # The site deploys from develop (see pages.yml). A workflow_dispatch event of the GITHUB_TOKEN starts a workflow run.
  site:
    name: Site
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the workflow Pages on develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref develop
