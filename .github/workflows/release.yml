name: Release

# A merge of develop into main makes a release. The version comes from the bump markers of the commits (see
# scripts/version.py). The workflow tags the commit of develop, creates a GitHub Release with the jars and the
# modpack (.mrpack), then publishes the mod jars to GitHub Packages (Maven). The release comes first: a Maven version
# is immutable, so a failed release step can run again only when the publication did not happen.
# When the tag of the version exists, the workflow makes no release. To run it again after a failure, use
# "Run workflow" on main.
# After the release, the workflow starts the workflow Pages on develop. Pages publishes the site of the project with
# the downloads and the notes of the releases, and version.json for the version badge of the README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.value }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the version.
          fetch-depth: 0

      # A merge of develop has two parents: the second parent is the commit of develop. The tag goes on it, so develop
      # contains the tags of the releases.
      - name: Find the commit of develop
        id: commit
        run: |
          commit=$(git rev-parse HEAD)
          if git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            commit=$(git rev-parse 'HEAD^2')
          fi
          if ! git diff --quiet HEAD "$commit"; then
            echo "The files of main and of the commit $commit of develop are different. Merge main into develop." >&2
            exit 1
          fi
          echo "value=$commit" >> "$GITHUB_OUTPUT"

      - name: Calculate the version
        id: version
        env:
          COMMIT: ${{ steps.commit.outputs.value }}
        run: |
          python3 scripts/version.py version --rev "$COMMIT" --github-output build-version.txt
          cat build-version.txt >> "$GITHUB_OUTPUT"
          tag=$(sed -n 's/^tag=//p' build-version.txt)
          if [ "$(sed -n 's/^exists=//p' build-version.txt)" = true ]; then
            echo "The tag \`${tag}\` exists: no release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release: \`${tag}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Build and publish
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      COMMIT: ${{ needs.version.outputs.commit }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the release notes.
          fetch-depth: 0

      - name: Write the release notes
        run: |
          mkdir -p build
          python3 scripts/version.py version --rev "$COMMIT" --repo "$GITHUB_REPOSITORY" --notes build/release-notes.md

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build, unit tests and translation check
        run: ./gradlew build -Pmod_version="$VERSION" --stacktrace

      - name: GameTest server
        run: ./gradlew :dev:runGameTestServer -Pmod_version="$VERSION" --stacktrace

      - name: Check for a modpack
        id: modpack
        run: |
          if [ -f modpack/pack.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Go
        if: steps.modpack.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      # packwiz has no releases: the commit is the same as in build.yml and .devcontainer/Dockerfile, so a release
      # has the same .mrpack content as the CI. The download can fail on a network error, so the step tries 3 times.
      - name: Install packwiz
        if: steps.modpack.outputs.present == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e && exit 0
            echo "Attempt $attempt failed. Next attempt in 15 seconds."
            sleep 15
          done
          exit 1

      - name: Export the modpack
        if: steps.modpack.outputs.present == 'true'
        run: scripts/export-modpack.sh "build/folkhold-${VERSION}.mrpack" "$VERSION"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          files=( */build/libs/folkhold_*-"${VERSION}".jar build/*.mrpack )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No jar to release for the version ${VERSION}." >&2
            exit 1
          fi
          gh release create "$TAG" "${files[@]}" \
            --target "$COMMIT" \
            --title "Folkhold ${VERSION}" \
            --notes-file build/release-notes.md

      - name: Publish to GitHub Packages
        run: ./gradlew publish -Pmod_version="$VERSION" --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The site deploys from develop (see pages.yml). A workflow_dispatch event of the GITHUB_TOKEN starts a workflow run.
  site:
    name: Site
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the workflow Pages on develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref develop
