name: Release

# Push a tag vX.Y.Z on main to make a release:
#   git tag v0.1.0 && git push origin v0.1.0
# The workflow publishes the mod jars to GitHub Packages (Maven)
# and creates a GitHub Release with the jars and the modpack (.mrpack).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and translation check
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.value }} --stacktrace

      - name: GameTest server
        run: ./gradlew :dev:runGameTestServer -Pmod_version=${{ steps.version.outputs.value }} --stacktrace

      - name: Publish to GitHub Packages
        run: ./gradlew publish -Pmod_version=${{ steps.version.outputs.value }} --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        if: hashFiles('modpack/pack.toml') != ''
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        if: hashFiles('modpack/pack.toml') != ''
        run: go install github.com/packwiz/packwiz@latest

      - name: Export the modpack
        if: hashFiles('modpack/pack.toml') != ''
        run: scripts/export-modpack.sh "build/folkhold-${{ steps.version.outputs.value }}.mrpack" "${{ steps.version.outputs.value }}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          files=$(ls */build/libs/folkhold_*-"${VERSION}".jar build/*.mrpack 2>/dev/null || true)
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $files \
            --title "Folkhold ${VERSION}" \
            --generate-notes \
            $prerelease
