name: Build

# Builds the mods and the modpack, and runs the tests. Each job has one task:
# - Version: calculates the version of the build (see .github/actions/version).
# - Build: compiles the mods, runs the unit tests, the translation check and the format check. Uploads the jars.
# - GameTests: runs the GameTest server. This job compiles the mods for its server, so it runs at the same time as
#   the job Build.
# - Modpack: makes the .mrpack file from the jars of the job Build.
# - Dev pack: for a push on develop only. Makes the dev pack (artifact folkhold-dev-pack): the packwiz pack with the
#   Folkhold jars, and a Prism Launcher instance that updates itself from this pack. The workflow Pages publishes it
#   in dev/.
# The workflow Release calls this workflow (workflow_call) with the input release: the version is the version of the
# release, and the job Build also uploads the Maven files of the mods (artifact folkhold-maven).

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build a release (see .github/actions/version).
        type: boolean
        default: false
    outputs:
      version:
        description: The version of the build.
        value: ${{ jobs.version.outputs.version }}
      tag:
        description: With release, the tag of the version.
        value: ${{ jobs.version.outputs.tag }}
      exists:
        description: With release, 'true' when the tag exists.
        value: ${{ jobs.version.outputs.exists }}
      commit:
        description: The commit of the version.
        value: ${{ jobs.version.outputs.commit }}

permissions:
  contents: read

# A new push on a pull request cancels the run of the earlier push. A push on develop is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE: ${{ inputs.release && 'true' || 'false' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the version.
          fetch-depth: 0

      - name: Calculate the version
        id: version
        uses: ./.github/actions/version
        with:
          release: ${{ env.RELEASE }}

      - name: Show the release
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXISTS: ${{ steps.version.outputs.exists }}
        run: |
          if [ "$EXISTS" = true ]; then
            echo "The tag \`${TAG}\` exists: no release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release: \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the changelog.
          fetch-depth: 0

      # The changelog of the "What's new" screen goes into the jar of core (see core/build.gradle). The check "Title
      # and version" reports the entries that are not valid, so this step does not stop the build.
      - name: Write the changelog
        run: |
          mkdir -p build
          python3 scripts/changelog.py build --rev "$COMMIT" --json build/changelog.json \
            || echo "::warning::No changelog in the jar."

      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-gradle

      # The task publishAllPublicationsToStagingRepository writes the Maven files of the mods to build/maven. The
      # workflow Release publishes these files to GitHub Packages.
      - name: Build, unit tests and translation check
        shell: bash
        run: |
          ./gradlew build publishAllPublicationsToStagingRepository -Pmod_version="$VERSION" --stacktrace 2>&1 \
            | tee build/ci-build.log
          exit "${PIPESTATUS[0]}"

      - name: Report the errors as annotations
        if: failure()
        run: scripts/ci-annotate-errors.sh build/ci-build.log

      - name: Upload the coverage report of core
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-core-coverage
          path: core/build/reports/jacoco/test/html
          if-no-files-found: ignore

      - name: Upload the mod jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-mods
          path: |
            */build/libs/folkhold_*.jar
            !*/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload the Maven files
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-maven
          path: build/maven
          if-no-files-found: error

  gametests:
    name: GameTests
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-gradle

      - name: GameTest server
        shell: bash
        run: |
          mkdir -p build
          ./gradlew :dev:runGameTestServer -Pmod_version="$VERSION" --stacktrace 2>&1 | tee build/ci-gametest.log
          exit "${PIPESTATUS[0]}"

      - name: Report the errors as annotations
        if: failure()
        run: scripts/ci-annotate-errors.sh build/ci-gametest.log

      - name: Upload the logs of the GameTest server
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-gametest-logs
          path: |
            build/ci-gametest.log
            dev/run-gametest/logs
          if-no-files-found: ignore

  modpack:
    name: Modpack
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the mod jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: folkhold-mods

      - name: Set up packwiz
        uses: ./.github/actions/setup-packwiz

      - name: Export the modpack
        run: scripts/export-modpack.sh "build/folkhold-${VERSION}.mrpack" "$VERSION"

      - name: Upload the modpack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-modpack
          path: build/folkhold-*.mrpack
          if-no-files-found: error

  dev-pack:
    name: Dev pack
    needs: [version, gametests, modpack]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the mod jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: folkhold-mods

      - name: Set up packwiz
        uses: ./.github/actions/setup-packwiz

      # The same packwiz pack as the .mrpack file of the job Modpack, in the folder build/dev-pack.
      - name: Make the dev pack
        run: scripts/export-modpack.sh "$RUNNER_TEMP/dev.mrpack" "$VERSION" build/dev-pack

      # The instance gets the URL of the dev pack on the site of the project (see pages.yml).
      - name: Make the dev instance
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/dev/pack.toml"
          scripts/dev-instance.sh build/dev-pack/folkhold-dev-instance.zip "$url"

      - name: Upload the dev pack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-dev-pack
          path: build/dev-pack
          if-no-files-found: error
