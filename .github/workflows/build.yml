name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, unit tests and translation check
        run: ./gradlew build --stacktrace

      - name: GameTest server
        run: ./gradlew :dev:runGameTestServer --stacktrace

      - name: Upload the mod jars
        uses: actions/upload-artifact@v7
        with:
          name: folkhold-mods
          path: |
            */build/libs/folkhold_*.jar
            !*/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Check for a modpack
        id: modpack
        run: |
          if [ -f modpack/pack.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Go
        if: steps.modpack.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        if: steps.modpack.outputs.present == 'true'
        run: go install github.com/packwiz/packwiz@latest

      - name: Export the modpack
        if: steps.modpack.outputs.present == 'true'
        run: scripts/export-modpack.sh build/folkhold-dev.mrpack

      - name: Upload the modpack
        if: steps.modpack.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: folkhold-modpack
          path: build/folkhold-dev.mrpack
          if-no-files-found: error
