name: Build

# Builds the mods and the modpack, and runs the tests. Each build has a version from scripts/version.py:
# - push on develop: the version of the commit, then "-dev." and the short commit. Example: 0.32.0-dev.13bcc38.
# - pull request: the version after the merge, then "-pr.", the number and the short commit. Example:
#   0.32.1-pr.472.abc1234. For a pull request from develop to main, the first part is the version of the release.
# - push on main: the version of the release.
# A build of develop also makes the dev pack (artifact folkhold-dev-pack): the packwiz pack with the Folkhold jars,
# and a Prism Launcher instance that updates itself from this pack. The workflow Pages publishes it in dev/.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push on a pull request cancels the run of the earlier push. A push on main or develop is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the version.
          fetch-depth: 0

      - name: Make the log folder
        run: mkdir -p build

      - name: Calculate the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          short=$(git rev-parse --short=7 "$HEAD_SHA")
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ]; then
            # A release: the version of the commit of develop.
            version="$(python3 scripts/version.py version --rev "$HEAD_SHA")-pr.${NUMBER}.${short}"
          elif [ "$EVENT" = pull_request ]; then
            base=$(python3 scripts/version.py version --rev "$BASE_SHA" --title "$TITLE" --author "$AUTHOR")
            version="${base}-pr.${NUMBER}.${short}"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            version=$(python3 scripts/version.py version --rev HEAD)
          else
            version="$(python3 scripts/version.py version --rev HEAD)-dev.${short}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version of this build: \`${version}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build, unit tests and translation check
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -Pmod_version="$VERSION" --stacktrace 2>&1 | tee build/ci-build.log; exit "${PIPESTATUS[0]}"

      - name: GameTest server
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :dev:runGameTestServer -Pmod_version="$VERSION" --stacktrace 2>&1 | tee build/ci-gametest.log
          exit "${PIPESTATUS[0]}"

      - name: Report the errors as annotations
        if: failure()
        run: scripts/ci-annotate-errors.sh build/ci-build.log build/ci-gametest.log

      - name: Upload the logs of the GameTest server
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-gametest-logs
          path: |
            build/ci-build.log
            build/ci-gametest.log
            dev/run-gametest/logs
          if-no-files-found: ignore

      - name: Upload the coverage report of core
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-core-coverage
          path: core/build/reports/jacoco/test/html
          if-no-files-found: ignore

      - name: Upload the mod jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-mods
          path: |
            */build/libs/folkhold_*.jar
            !*/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Check for a modpack
        id: modpack
        run: |
          if [ -f modpack/pack.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Go
        if: steps.modpack.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      # packwiz has no releases: the commit is the same as in .devcontainer/Dockerfile. The download can fail on a
      # network error, so the step tries 3 times.
      - name: Install packwiz
        if: steps.modpack.outputs.present == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e && exit 0
            echo "Attempt $attempt failed. Next attempt in 15 seconds."
            sleep 15
          done
          exit 1

      # A build of develop also keeps the packwiz pack with the Folkhold jars (folder build/dev-pack).
      - name: Export the modpack
        if: steps.modpack.outputs.present == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEV_PACK: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && 'build/dev-pack' || '' }}
        run: |
          args=("build/folkhold-${VERSION}.mrpack" "$VERSION")
          if [ -n "$DEV_PACK" ]; then
            args+=("$DEV_PACK")
          fi
          scripts/export-modpack.sh "${args[@]}"

      - name: Upload the modpack
        if: steps.modpack.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-modpack
          path: build/folkhold-*.mrpack
          if-no-files-found: error

      # The instance gets the URL of the dev pack on the site of the project (see pages.yml).
      - name: Make the dev instance
        if: steps.modpack.outputs.present == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/dev/pack.toml"
          scripts/dev-instance.sh build/dev-pack/folkhold-dev-instance.zip "$url"

      - name: Upload the dev pack
        if: steps.modpack.outputs.present == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-dev-pack
          path: build/dev-pack
          if-no-files-found: error
