name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push on a pull request cancels the run of the earlier push. A push on main is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make the log folder
        run: mkdir -p build

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build, unit tests and translation check
        shell: bash
        run: ./gradlew build --stacktrace 2>&1 | tee build/ci-build.log; exit "${PIPESTATUS[0]}"

      - name: GameTest server
        shell: bash
        run: ./gradlew :dev:runGameTestServer --stacktrace 2>&1 | tee build/ci-gametest.log; exit "${PIPESTATUS[0]}"

      - name: Report the errors as annotations
        if: failure()
        run: scripts/ci-annotate-errors.sh build/ci-build.log build/ci-gametest.log

      - name: Upload the logs of the GameTest server
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-gametest-logs
          path: |
            build/ci-build.log
            build/ci-gametest.log
            dev/run/logs
          if-no-files-found: ignore

      - name: Upload the mod jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-mods
          path: |
            */build/libs/folkhold_*.jar
            !*/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Check for a modpack
        id: modpack
        run: |
          if [ -f modpack/pack.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Go
        if: steps.modpack.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      # packwiz has no releases: the commit is the same as in .devcontainer/Dockerfile. The download can fail on a
      # network error, so the step tries 3 times.
      - name: Install packwiz
        if: steps.modpack.outputs.present == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e && exit 0
            echo "Attempt $attempt failed. Next attempt in 15 seconds."
            sleep 15
          done
          exit 1

      - name: Export the modpack
        if: steps.modpack.outputs.present == 'true'
        run: scripts/export-modpack.sh build/folkhold-dev.mrpack

      - name: Upload the modpack
        if: steps.modpack.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folkhold-modpack
          path: build/folkhold-dev.mrpack
          if-no-files-found: error
