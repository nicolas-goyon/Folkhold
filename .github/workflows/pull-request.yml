# Checks the pull requests (see scripts/version.py and CONTRIBUTING.md).
# - To develop: the title has a bump marker, and the summary gives the version after the merge.
# - To main: the source branch is develop, and the summary gives the version and the notes of the release.
name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Title and version
    if: github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the version.
          fetch-depth: 0

      # Dependabot cannot add a bump marker to its titles: its commits count as [patch].
      - name: Check the title
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/version.py check-title "$TITLE"

      - name: Show the version after the merge
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          now=$(python3 scripts/version.py version --rev "$BASE")
          after=$(python3 scripts/version.py version --rev "$BASE" --title "$TITLE" --author "$AUTHOR")
          {
            echo "### Version"
            echo
            echo "After the merge, \`develop\` has the version **${after}**. Now: ${now}."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release preview
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != develop ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "main gets only the merges of develop. Open the pull request to develop." >&2
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the version.
          fetch-depth: 0

      - name: Show the release
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p build
          python3 scripts/version.py version --rev "$HEAD" --repo "$GITHUB_REPOSITORY" \
            --notes build/release-notes.md --github-output build/version.txt
          version=$(sed -n 's/^version=//p' build/version.txt)
          exists=$(sed -n 's/^exists=//p' build/version.txt)
          {
            echo "### Release"
            echo
            if [ "$exists" = true ]; then
              echo "The tag \`v${version}\` exists: the merge makes no release."
            else
              echo "The merge makes the release **v${version}**."
            fi
            echo
            cat build/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
