# Checks the scripts. The tests of scripts/ run, and the generated files are up to date: the structures,
# the block models and the textures come from the scripts of tools/. A change to a script or to a generated file must
# come with the output of the scripts.
# The generators of .nbt files do not write a file when its uncompressed content does not change (nbt.write_nbt).
# The texture generators of tools/textures do not write a PNG file when its decoded pixels do not change, and they
# write with pixvox.png.save_png (the same bytes on all machines) (png_file.write_png).
# Thus the byte comparison below does not depend on the zlib or the Pillow of the machine, and it fails when the
# content of a template or the pixels of a texture change.
name: Generated files

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Scripts and their output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Pillow and PixVox
        run: pip install pillow -r tools/pixvox/requirements.txt

      - name: Tests of the scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run the generators
        run: |
          python3 tools/structures/village.py
          python3 tools/pixvox/building_signs.py
          python3 tools/pixvox/quest_board.py
          python3 tools/textures/villager_professions.py
          python3 tools/textures/golem_armband.py
          python3 tools/textures/map_decorations.py
          python3 tools/pixvox/export.py
          python3 tools/make_test_structure.py world/src/gametest/resources/data/folkhold_world/structure/empty.nbt
          python3 tools/make_test_structure.py world/src/gametest/resources/data/folkhold_world/structure/arena.nbt --size 16 4 16
          python3 tools/make_test_structure.py world/src/gametest/resources/data/folkhold_world/structure/arena_large.nbt --size 32 4 32
          python3 tools/make_test_structure.py world/src/gametest/resources/data/folkhold_world/structure/arena_huge.nbt --size 56 4 56

      - name: Compare with the repository
        run: |
          git add --all
          git status --short
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --stat
          # For each changed .nbt file, tell if the uncompressed content changes or only the gzip bytes.
          git diff --cached --name-only --diff-filter=M -- '*.nbt' | while read -r f; do
            if cmp -s <(git show "HEAD:$f" | gzip -dc) <(gzip -dc "$f"); then
              echo "::error file=$f::Same content, other gzip bytes. Write this file with nbt.write_nbt."
            else
              echo "::error file=$f::The content changes. Run the generators and commit their output."
            fi
          done
          # For each changed .png file, tell if the pixels change or only the PNG bytes.
          git diff --cached --name-only --diff-filter=M -- '*.png' | while read -r f; do
            if git show "HEAD:$f" | python3 -c 'import io, sys; from PIL import Image
          a = Image.open(io.BytesIO(sys.stdin.buffer.read())); b = Image.open(sys.argv[1])
          sys.exit(0 if (a.mode, a.size, a.tobytes()) == (b.mode, b.size, b.tobytes()) else 1)' "$f"; then
              echo "::error file=$f::Same pixels, other PNG bytes. Write this file with png_file.write_png."
            else
              echo "::error file=$f::The pixels change. Run the generators and commit their output."
            fi
          done
          exit 1
