plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

// The mods block below uses the source sets of the core and blocks projects.
evaluationDependsOn(':core')
evaluationDependsOn(':blocks')

apply from: rootProject.file('gradle/mod-common.gradle')

dependencies {
    api project(':core')
    api project(':blocks')
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Optional: the territories on the maps of Xaero's mods (see XaeroMaps).
    compileOnly "maven.modrinth:xaeros-minimap:${xaero_minimap_version}"
    compileOnly "maven.modrinth:xaeros-world-map:${xaero_world_map_version}"
}

neoForge {
    mods {
        folkhold_core {
            sourceSet(project(':core').sourceSets.main)
        }
        folkhold_blocks {
            sourceSet(project(':blocks').sourceSets.main)
        }
    }

    // JUnit tests with the game runtime: the registries and the mods are loaded, there is no server.
    unitTest {
        enable()
        testedMod = mods.folkhold_world
    }
}
