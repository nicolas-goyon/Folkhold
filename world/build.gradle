plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

// The mods block below uses the source set of the core project.
evaluationDependsOn(':core')

apply from: rootProject.file('gradle/mod-common.gradle')

dependencies {
    api project(':core')
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

neoForge {
    mods {
        folkhold_core {
            sourceSet(project(':core').sourceSets.main)
        }
    }

    // JUnit tests with the game runtime: the registries and the mods are loaded, there is no server.
    unitTest {
        enable()
        testedMod = mods.folkhold_world
    }
}
